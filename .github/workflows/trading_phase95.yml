name: Trading Phase 95

on:
  schedule:
    - cron: "*/5 13-21 * * 1-5"
    - cron: "*/5 14-22 * * 1-5"
  workflow_dispatch:

jobs:
  run-bot-phase95:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install alpaca-trade-api pandas numpy pytz

      - name: Run bot_phase95.py
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          APCA_API_BASE_URL: ${{ secrets.APCA_API_BASE_URL }}
        run: python bot_phase95.py

      - name: Upload phase95 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase95-artifacts
          path: |
            logs/
            data/
