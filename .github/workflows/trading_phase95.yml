name: trading_phase95

on:
  schedule:
    # 9:30, 9:40, 9:50 ET (13:30, 13:40, 13:50 UTC during DST)
    - cron: "30,40,50 13 * * 1-5"
    # 10:00–12:50 ET every 10 minutes (14:00–16:50 UTC during DST)
    - cron: "0,10,20,30,40,50 14-16 * * 1-5"
    # 1:00 ET final management / forced-flat run (17:00 UTC during DST)
    - cron: "0 17 * * 1-5"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install alpaca-trade-api pandas numpy pytz

      - name: Run bot_phase95
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          APCA_API_BASE_URL: ${{ secrets.APCA_API_BASE_URL }}
        run: python bot_phase95.py
