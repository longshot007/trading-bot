name: trading_phase97

on:
  schedule:
    # ── DST (2nd Sun Mar → 1st Sun Nov) ET = UTC−4 ──────────────────────────
    # 9:30–9:50 ET open burst
    - cron: "30,40,50 13 * * 1-5"
    # 10:00–15:50 ET every 10 min
    - cron: "0,10,20,30,40,50 14-19 * * 1-5"
    # 16:00 ET final management
    - cron: "0 20 * * 1-5"

    # ── Standard time (1st Sun Nov → 2nd Sun Mar) ET = UTC−5 ────────────────
    # 9:30–9:50 ET open burst
    - cron: "30,40,50 14 * * 1-5"
    # 10:00–15:50 ET every 10 min
    - cron: "0,10,20,30,40,50 15-20 * * 1-5"
    # 16:00 ET final management
    - cron: "0 21 * * 1-5"

  # Manual trigger — use this to confirm the workflow is still enabled
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cache pip to speed up cold starts (~60s saved per run)
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run bot
        env:
          APCA_API_KEY_ID:     ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
          APCA_API_BASE_URL:   ${{ secrets.APCA_API_BASE_URL }}
        run: python bot_phase97.py

      # Commit state and logs back to the repo so they persist across runs
      - name: Commit state and logs
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/ logs/
          git diff --cached --quiet || (
            git commit -m "bot: $(date -u +%Y-%m-%dT%H:%M:%SZ)" &&
            git pull --rebase origin main &&
            git push origin main
          )

      # Also upload today's log as a downloadable artifact
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-log-${{ github.run_id }}
          path: logs/bot_*.json
          if-no-files-found: ignore
          retention-days: 30
