name: trading-bot

on:
  workflow_dispatch:        # allows manual run
  schedule:
    - cron: "*/15 13-20 * * 1-5"  # every 15 minutes during US market hours (EST 9:30-16:00)

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        run: python bot.py
