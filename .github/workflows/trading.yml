name: Phase-5 Trading Bot

# Run every minute for active monitoring
on:
  schedule:
    - cron: "*/1 * * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install alpaca-trade-api pandas numpy xgboost joblib flask requests

      - name: Run Phase-5 Bot
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          python bot.py

      - name: Archive trades log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trades-log
          path: trades.log
